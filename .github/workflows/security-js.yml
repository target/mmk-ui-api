name: Security Scanning (JS)

# JavaScript/TypeScript half of the old security.yml. Scoped to the code that
# actually contains JS: the puppeteer worker and the merrymaker-go frontend
# (which lives inside the Go service directory but is built with Bun).
#
# This means a Go-only PR no longer pays for JS CodeQL (~74s) or npm audit,
# and a docs-only PR runs no scanners at all. The daily schedule still runs
# every scanner regardless of what changed.

on:
  push:
    branches: [main]
    paths:
      - "services/puppeteer-worker/**"
      - "services/merrymaker-go/frontend/**"
      - ".github/workflows/security-js.yml"
  pull_request:
    paths:
      - "services/puppeteer-worker/**"
      - "services/merrymaker-go/frontend/**"
      - ".github/workflows/security-js.yml"
  schedule:
    # Daily at 02:00 UTC — catches newly published CVEs between dependency bumps
    - cron: "0 2 * * *"
  workflow_dispatch:

# Workflow-level permissions are read-only. Jobs that upload SARIF raise
# security-events to write themselves, so a compromised script step in any
# other job cannot write to the Security tab.
permissions:
  contents: read

concurrency:
  group: security-js-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── npm audit (puppeteer-worker) ─────────────────────────────────────────
  npm-audit:
    name: npm audit (puppeteer-worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/puppeteer-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/puppeteer-worker/package-lock.json

      - name: Install dependencies (skip Chromium download)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci --ignore-scripts

      - name: npm audit
        # Pre-existing vulnerabilities in puppeteer-worker deps — tracked via
        # GitHub Security tab. Remove continue-on-error once Dependabot PRs
        # have cleared the existing CVE backlog.
        continue-on-error: true
        run: npm audit --audit-level=high

  # ── Trivy: filesystem scan — puppeteer-worker ────────────────────────────
  trivy-puppeteer:
    name: Trivy FS (puppeteer-worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload-sarif writes to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/puppeteer-worker
          format: sarif
          output: trivy-puppeteer.sarif
          severity: CRITICAL,HIGH
          exit-code: "0" # informational — SARIF results appear in Security tab; existing debt addressed via Dependabot
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-puppeteer.sarif
          category: trivy-puppeteer-worker

  # ── CodeQL — JavaScript/TypeScript ───────────────────────────────────────
  codeql-javascript:
    name: CodeQL (javascript-typescript)
    # Pinned, not `ubuntu-latest`: the label migrates from Ubuntu 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19 (actions/runner-images#14748),
    # so `latest` can change the OS under a job with no commit. See
    # runner-os-canary.yml for the 26.04 rehearsal.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # codeql-action/analyze uploads results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript
