name: Dependabot auto-merge

# ┌─ Security model (May 2026) ──────────────────────────────────────────────┐
# │                                                                           │
# │  Auto-merge is a supply-chain risk. The March 2026 Axios attack merged   │
# │  a malicious patch bump into 95 repos in < 1 hour via exactly this       │
# │  pattern. The trivy-action attack showed that even SHA-pinned Actions     │
# │  can be silently updated to point at malicious commits by automation.     │
# │                                                                           │
# │  What we auto-merge (after CI passes + 3-day cooldown in dependabot.yml):│
# │    ✅ Security updates  — patch or minor, gomod / npm / bun only         │
# │    ✅ Regular patch bumps — gomod / npm / bun only                       │
# │                                                                           │
# │  "Auto-merge" here means the merge is armed. A human approval is still    │
# │  required by the default-branch-protection ruleset, because an approval    │
# │  created with GITHUB_TOKEN does not satisfy a required review.             │
# │                                                                           │
# │  What always requires human review:                                       │
# │    🔴 github-actions  — executes in CI with full secret access           │
# │    🔴 docker          — base-image supply-chain vector                   │
# │    🔴 Major bumps     — breaking changes, any ecosystem                  │
# │    🔴 Minor non-security bumps — weekly triage                           │
# │                                                                           │
# └───────────────────────────────────────────────────────────────────────────┘

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Default deny. The job grants pull-requests: write for itself below;
# contents: write was previously granted here and never used.
permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    # Pinned, not `ubuntu-latest`: the label migrates from Ubuntu 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19 (actions/runner-images#14748),
    # so `latest` can change the OS under a job with no commit. See
    # runner-os-canary.yml for the 26.04 rehearsal.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # gh pr merge --auto arms the merge on this PR
    concurrency:
      # One arming run per pull request; a later push cancels an in-flight run.
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Check the PR's author and branch prefix rather than `github.actor`, which
    # only records who triggered the run. A workflow_dispatch or a rerun by
    # another user would keep the actor check happy while the PR is not
    # dependabot's.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Hard block: GitHub Actions ecosystem ─────────────────────────────
      # The workflow YAML runs inside CI with full secret access. A compromised
      # SHA pin (trivy-action attack, Mar 2026) silently executes malicious
      # code on every subsequent PR. Always require a human to verify the diff.
      - name: Skip — github-actions (supply-chain risk, manual review required)
        if: steps.meta.outputs.package-ecosystem == 'github_actions'
        run: |
          echo "::notice::GitHub Actions bump — manual review required."
          echo "::notice::Reason: actions run in CI with secret access (ref: trivy-action supply-chain attack, Mar 2026)"

      # ── Hard block: Docker ecosystem ─────────────────────────────────────
      # Compromised base images silently replace the runtime environment.
      - name: Skip — docker (supply-chain risk, manual review required)
        if: steps.meta.outputs.package-ecosystem == 'docker'
        run: |
          echo "::notice::Docker base-image bump — manual review required."
          echo "::notice::Reason: base-image supply-chain vector"

      # ── Hard block: major version bumps ──────────────────────────────────
      - name: Skip — major version bump (manual review required)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          echo "::notice::Major bump ($NAMES) — manual review required."

      # ── Auto-merge gate ───────────────────────────────────────────────────
      # Arm auto-merge when ALL of:
      #   • gomod, npm/yarn, or bun ecosystem (not github-actions, not docker)
      #   • patch bump  OR  any security update (ghsa-id is set)
      #   • not a major bump (belt-and-suspenders — already blocked above)
      #
      # This step does not approve the PR. An approval created with
      # GITHUB_TOKEN does not satisfy the required-review rule in the
      # default-branch-protection ruleset, so the previous
      # `gh pr review --approve` never counted and has been removed. A human
      # approval is still required before merge: this gate decides whether
      # auto-merge is armed, not whether review is skipped.
      - name: Enable auto-merge
        if: |
          (
            steps.meta.outputs.package-ecosystem == 'go_modules' ||
            steps.meta.outputs.package-ecosystem == 'npm_and_yarn' ||
            steps.meta.outputs.package-ecosystem == 'bun'
          ) && (
            steps.meta.outputs.update-type == 'version-update:semver-patch' ||
            steps.meta.outputs.ghsa-id != ''
          ) &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Step outputs reach the shell through the environment. Interpolating
          # them into the script would let a crafted dependency name inject
          # commands into a job that holds a write-scoped token.
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GHSA: ${{ steps.meta.outputs.ghsa-id }}
        run: |
          echo "Arming auto-merge: $NAMES"
          echo "Update type:       $UPDATE_TYPE"
          echo "GHSA:              $GHSA"
          gh pr merge --auto --squash "$PR_URL"
