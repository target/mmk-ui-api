name: Puppeteer Worker CI

# This job used to live in merrymaker-go.yml, whose `paths:` filter is
# services/merrymaker-go/**. Two consequences, both wrong:
#
#   1. Puppeteer worker PRs (e.g. a `puppeteer` or storage-SDK bump) never ran
#      their own test suite — the only functional coverage this service has.
#   2. Go-only PRs paid ~55s for a Node + Chrome install and a suite that
#      cannot be affected by a Go change.
#
# Living in its own path-filtered workflow fixes both.

on:
  push:
    branches: [main]
    paths: &puppeteer-paths
      - "services/puppeteer-worker/**"
      - ".github/workflows/puppeteer-worker.yml"
  pull_request:
    paths: *puppeteer-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puppeteer-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Puppeteer Worker Tests
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome"
      NODE_OPTIONS: "--max-old-space-size=4096"
      TMPDIR: /home/runner/work/_temp
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/puppeteer-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/puppeteer-worker/package-lock.json

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fonts-liberation
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm -f google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Test
        run: npm test
