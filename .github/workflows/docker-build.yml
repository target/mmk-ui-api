name: Docker Build (Reusable)

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username for docker/login-action (required when inputs.push is true)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub token/password for docker/login-action (required when inputs.push is true)
        required: false
    inputs:
      image:
        description: Fully qualified image name, e.g. ghcr.io/org/repo/service
        required: true
        type: string
      tag_prefix:
        description: Optional tag prefix (useful when multiple services share one repo)
        required: false
        type: string
        default: ""
      context:
        description: Docker build context path (repo-relative)
        required: true
        type: string
      dockerfile:
        description: Dockerfile path (repo-relative)
        required: true
        type: string
      push:
        description: Whether to push the built image(s) to the registry
        required: true
        type: boolean
      pre_build_workdir:
        description: Optional working directory for pre-build step
        required: false
        type: string
        default: ""
      pre_build_cmd:
        description: Optional shell command(s) to run before docker build
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build${{ inputs.push && ' & Push' || '' }}
    # Pinned, not `ubuntu-latest`: the label migrates from Ubuntu 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19 (actions/runner-images#14748),
    # so `latest` can change the OS under a job with no commit. See
    # runner-os-canary.yml for the 26.04 rehearsal.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: ${{ inputs.pre_build_cmd != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"
          # This workflow publishes runtime artifacts (container images), so a
          # poisoned cache entry could be promoted into a published image.
          # Skip the dependency cache here and install from the lockfile.
          no-cache: true

      - name: Pre-build
        if: ${{ inputs.pre_build_cmd != '' }}
        working-directory: ${{ inputs.pre_build_workdir }}
        shell: bash
        # Inputs reach the script through the environment instead of being
        # interpolated into it, so their contents cannot alter the script.
        env:
          PRE_BUILD_CMD: ${{ inputs.pre_build_cmd }}
        run: bash -c "$PRE_BUILD_CMD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute release version
        id: vars
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          is_release=false
          version=""

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            prefix="$TAG_PREFIX"

            if [[ -n "$prefix" && "$tag" == "$prefix"-v* ]]; then
              version="${tag#"$prefix"-v}"
              is_release=true
            elif [[ -z "$prefix" && "$tag" == v* ]]; then
              version="${tag#v}"
              is_release=true
            fi
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.is_release == 'true' }}
            type=sha,prefix=sha-

      - name: Build${{ inputs.push && ' & push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}/${{ inputs.context }}
          file: ${{ github.workspace }}/${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version || github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and SBOM are only useful for artifacts we publish. On PR
          # builds (push=false) they add attested-metadata generation to a build
          # that is thrown away.
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
