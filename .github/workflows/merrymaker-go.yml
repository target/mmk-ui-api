name: Merrymaker Go CI

on:
  # Push runs are limited to main on purpose. With an unfiltered `push` trigger,
  # every in-repo branch push ran this whole workflow *and* the pull_request
  # run for the same commit — dependabot branches alone doubled the cost
  # (~370s + ~360s per PR). PRs are covered by the pull_request trigger below.
  push:
    branches: [main]
    paths:
      - "services/merrymaker-go/**"
      - ".github/workflows/merrymaker-go.yml"
      - ".github/workflows/reusable-go-tests.yml"
  pull_request:
    paths:
      - "services/merrymaker-go/**"
      - ".github/workflows/merrymaker-go.yml"
      - ".github/workflows/reusable-go-tests.yml"

permissions:
  contents: read

concurrency:
  group: mmk-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  # ── Lint + GoSec ─────────────────────────────────────────────────────────
  # GoSec used to be a separate job that repeated checkout, Go toolchain setup
  # and the frontend embed build (~25s of pure duplication) on its own runner.
  # Both tools are static analyses over the same tree, so they share one job.
  lint:
    name: GolangCI-Lint + GoSec
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/merrymaker-go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/merrymaker-go/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: services/merrymaker-go/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build frontend assets (embed targets)
        working-directory: services/merrymaker-go/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: services/merrymaker-go

      - name: Install gosec
        # Pinned instead of @latest: an unpinned security tool means CI silently
        # changes behaviour (and supply-chain exposure) between runs.
        # GOTOOLCHAIN=auto allows Go to fetch a newer toolchain if gosec
        # requires a Go version newer than the one declared in go.mod.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        # Pre-existing findings (G101/G124/G202/G706/G710) tracked via Security tab.
        # Remove continue-on-error once remediation PRs are merged.
        continue-on-error: true
        run: gosec ./...

  test:
    name: Go Tests (integration)
    # Defined once in reusable-go-tests.yml so runner-os-canary.yml can run the
    # identical job on ubuntu-26.04 instead of on a drifting copy.
    uses: $/.github/workflows/reusable-go-tests.yml
    with:
      runner: ubuntu-24.04

  frontend:
    name: Frontend Lint & Test
    # Pinned, not `ubuntu-latest`: the label migrates from Ubuntu 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19 (actions/runner-images#14748),
    # so `latest` can change the OS under a job with no commit. See
    # runner-os-canary.yml for the 26.04 rehearsal.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/merrymaker-go/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test
