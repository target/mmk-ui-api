name: Merrymaker Go CI

on:
  # Push runs are limited to main on purpose. With an unfiltered `push` trigger,
  # every in-repo branch push ran this whole workflow *and* the pull_request
  # run for the same commit — dependabot branches alone doubled the cost
  # (~370s + ~360s per PR). PRs are covered by the pull_request trigger below.
  push:
    branches: [main]
    paths:
      - "services/merrymaker-go/**"
      - ".github/workflows/merrymaker-go.yml"
  pull_request:
    paths:
      - "services/merrymaker-go/**"
      - ".github/workflows/merrymaker-go.yml"

permissions:
  contents: read

concurrency:
  group: mmk-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  # ── Lint + GoSec ─────────────────────────────────────────────────────────
  # GoSec used to be a separate job that repeated checkout, Go toolchain setup
  # and the frontend embed build (~25s of pure duplication) on its own runner.
  # Both tools are static analyses over the same tree, so they share one job.
  lint:
    name: GolangCI-Lint + GoSec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/merrymaker-go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/merrymaker-go/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: services/merrymaker-go/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build frontend assets (embed targets)
        working-directory: services/merrymaker-go/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: services/merrymaker-go

      - name: Install gosec
        # Pinned instead of @latest: an unpinned security tool means CI silently
        # changes behaviour (and supply-chain exposure) between runs.
        # GOTOOLCHAIN=auto allows Go to fetch a newer toolchain if gosec
        # requires a Go version newer than the one declared in go.mod.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        # Pre-existing findings (G101/G124/G202/G706/G710) tracked via Security tab.
        # Remove continue-on-error once remediation PRs are merged.
        continue-on-error: true
        run: gosec ./...

  test:
    name: Go Tests (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/merrymaker-go
    services:
      postgres:
        # Digest-pinned so CI runs a fixed image. Neither Dependabot nor Renovate
        # bumps service-container digests here, so refresh by hand:
        #   docker buildx imagetools inspect postgres:15.14
        # then update the digest below.
        image: postgres:15.14@sha256:822f8795764a670160640888508b2a68ea5c4b045012c2de17e1d0447bdbdc99
        env:
          POSTGRES_DB: merrymaker
          POSTGRES_USER: merrymaker
          POSTGRES_PASSWORD: merrymaker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Digest-pinned so CI runs a fixed image. Neither Dependabot nor Renovate
        # bumps service-container digests here, so refresh by hand:
        #   docker buildx imagetools inspect redis:7-alpine
        # then update the digest below.
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/merrymaker-go/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: services/merrymaker-go/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build frontend assets (embed targets)
        working-directory: services/merrymaker-go/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install DB clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Wait for Postgres
        run: |
          for _ in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U merrymaker >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for _ in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready in time" >&2
          exit 1

      - name: Run Go tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_USER: merrymaker
          TEST_DB_PASSWORD: merrymaker
          TEST_DB_NAME: merrymaker
          TEST_DB_EPHEMERAL: "1"
          DB_SSL_MODE: disable
          TEST_REQUIRE_INFRA: "1"
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...

  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/merrymaker-go/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun run test
