name: Go tests (reusable)

# Single source of truth for the Go test job. merrymaker-go.yml calls this with
# the pinned CI runner; runner-os-canary.yml calls it with ubuntu-26.04 so the
# Ubuntu 24.04 -> 26.04 migration is rehearsed on the real job instead of on a
# copy that can drift.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner image label, for example ubuntu-24.04
        required: false
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  test:
    name: Go Tests (integration)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/merrymaker-go
    services:
      postgres:
        # Digest-pinned so CI runs a fixed image. Neither Dependabot nor Renovate
        # bumps service-container digests here, so refresh by hand:
        #   docker buildx imagetools inspect postgres:15.14
        # then update the digest below.
        image: postgres:15.14@sha256:822f8795764a670160640888508b2a68ea5c4b045012c2de17e1d0447bdbdc99
        env:
          POSTGRES_DB: merrymaker
          POSTGRES_USER: merrymaker
          POSTGRES_PASSWORD: merrymaker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Digest-pinned so CI runs a fixed image. Neither Dependabot nor Renovate
        # bumps service-container digests here, so refresh by hand:
        #   docker buildx imagetools inspect redis:7-alpine
        # then update the digest below.
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/merrymaker-go/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: services/merrymaker-go/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Build frontend assets (embed targets)
        working-directory: services/merrymaker-go/frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install DB clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Wait for Postgres
        run: |
          for _ in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U merrymaker >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Wait for Redis
        run: |
          for _ in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready in time" >&2
          exit 1

      - name: Run Go tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_USER: merrymaker
          TEST_DB_PASSWORD: merrymaker
          TEST_DB_NAME: merrymaker
          TEST_DB_EPHEMERAL: "1"
          DB_SSL_MODE: disable
          TEST_REQUIRE_INFRA: "1"
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./...
