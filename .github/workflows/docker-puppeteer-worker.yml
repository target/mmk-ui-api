name: Docker Image - puppeteer-worker

on:
  pull_request:
    paths:
      - "services/puppeteer-worker/**"
      - ".github/workflows/docker-*.yml"
  push:
    tags:
      - "puppeteer-worker-v*.*.*"

# Only read access is needed: the image is pushed to Docker Hub with the
# credentials passed to the reusable workflow, not to GitHub Packages.
permissions:
  contents: read

concurrency:
  group: docker-puppeteer-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    # $/ is GitHub's self-repository syntax (GA on github.com since 2026-07-30):
    # it resolves to this repository at the commit being run, without a checkout.
    uses: $/.github/workflows/docker-build.yml
    # Pass the two registry credentials explicitly instead of `secrets:
    # inherit`, so this job cannot read any other repository secret.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      image: target/puppeteer-worker
      tag_prefix: puppeteer-worker
      context: services/puppeteer-worker
      dockerfile: services/puppeteer-worker/Dockerfile
      push: ${{ github.event_name == 'push' }}
